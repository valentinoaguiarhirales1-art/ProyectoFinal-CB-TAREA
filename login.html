<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conquer Blocks - Login</title>
    <meta name="description" content="Inicia sesión en Conquer Blocks con tu email y tu contraseña.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <img src="images/logo-conquer.png" alt="Logotipo de Conquer Blocks" width="120" height="120">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="quienes-somos.html">Quiénes somos</a></li>
                <li><a href="cursos.html">Cursos</a></li>

                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Iniciar sesión</h1>
        <p>Escribe tu email y tu contraseña para entrar.</p>

        <section>
            <form action="#" method="post">
                <p>
                    <label for="login-email">Email:</label>
                    <input type="email" id="login-email" name="email" placeholder="correo@ejemplo.com" required>
                </p>

                <p>
                    <label for="login-password">Contraseña:</label>
                    <input type="password" id="login-password" name="password" required>
                </p>

                <p>
                    <button type="submit">Iniciar sesión</button>
                </p>

                <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Conquer Blocks. Todos los derechos reservados.</p>
        <p><a href="aviso-legal.html">Aviso legal</a></p>
    </footer>

</body>
